<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>The Velmoric Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <button class="brand" id="brandBtn">THE VELMORIC CODEX</button>
  <div class="search-wrap">
    <input id="search" class="search" type="search" placeholder="Cari nama, ras, kategori…">
  </div>
  <div class="actions">
    <button class="btn" id="btnLogin">Login</button>
    <button class="btn" id="btnLogout" hidden>Logout</button>
    <button class="btn primary" id="btnAdd" hidden>Tambah</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-title">Navigasi</div>
    <button class="side-link active" id="navHome">Halaman Utama</button>
    <button class="side-link" id="navAdmin" hidden>Panel Admin</button>
    <div class="side-title">Daftar Entri</div>
    <div id="charList"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<audio id="bgMusic" crossorigin="anonymous"></audio>

<div class="bottom-player" id="musicPlayer">
  <div id="trackTitle" class="track-title">Belum ada musik</div>
  <div class="player-controls">
    <button class="player-btn" id="btnPrevTrack">|◀</button>
    <button class="player-btn" id="btnPlayPause">
      <span id="iconPlay">▶</span>
      <span id="iconPause" hidden>Ⅱ</span>
    </button>
    <button class="player-btn" id="btnNextTrack">▶|</button>
  </div>
  <div class="player-progress">
    <span id="timeCurrent">0:00</span>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span id="timeTotal">0:00</span>
  </div>
</div>

<div class="overlay" id="adminSettingsModal">
  <section class="modal small">
    <header class="modal-head">
      <h2>Pengaturan Codex</h2>
      <button class="icon-btn" id="closeSettings">✕</button>
    </header>
    <div class="modal-body">
      <label class="theme-row">
        Mode terang
        <input type="checkbox" id="toggleTheme">
      </label>
      <label class="field">
        Playlist musik (satu URL per baris)
        <textarea id="inputMusicUrl" rows="5"></textarea>
      </label>
      <div class="actions">
        <button class="btn" id="btnExport">Ekspor JSON</button>
        <label class="btn">
          Impor JSON
          <input id="btnImport" type="file" accept=".json,application/json" hidden>
        </label>
      </div>
      <button class="btn primary full" id="btnSaveSettings">Simpan Pengaturan</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <section class="modal">
    <header class="modal-head">
      <h2 id="modalTitle">Tambah Entri</h2>
      <button class="icon-btn" id="closeModal">✕</button>
    </header>
    <form id="charForm">
      <div class="form-grid">
        <label class="field">Nama *
          <input name="nama" required>
        </label>
        <label class="field">Kategori
          <select name="kategori">
            <option>Karakter</option>
            <option>Makhluk</option>
            <option>Lokasi</option>
            <option>Senjata</option>
            <option>Sejarah</option>
          </select>
        </label>
        <label class="field">Link Foto
          <input type="url" name="foto" id="fotoUrlInput">
          <img id="fotoPreview" hidden alt="Pratinjau foto">
        </label>
        <label class="field">Avatar / Emoji
          <input name="avatar" placeholder="👤">
        </label>
        <label class="field">Gelar<input name="gelar"></label>
        <label class="field">Ras / Spesies<input name="ras"></label>
        <label class="field">Jenis Kelamin<input name="gender"></label>
        <label class="field">Usia<input name="usia"></label>
        <label class="field">Tinggi<input name="tinggi"></label>
        <label class="field">Berat<input name="berat"></label>
        <label class="field">Asal / Dunia<input name="asal"></label>
        <label class="field">Afiliasi<input name="afiliasi"></label>
        <label class="field">Status<input name="status"></label>
        <label class="field">Elemen / Kelas<input name="kelas"></label>
      </div>
      <label class="field">Deskripsi<textarea name="deskripsi" rows="2"></textarea></label>
      <label class="field">Kepribadian<textarea name="kepribadian" rows="3"></textarea></label>
      <label class="field">Latar Belakang<textarea name="latar" rows="4"></textarea></label>
      <label class="field">Kemampuan<textarea name="kemampuan" rows="3"></textarea></label>
      <label class="field">Kelemahan<textarea name="kelemahan" rows="3"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelBtn">Batal</button>
        <button class="btn primary" id="submitBtn">Simpan</button>
      </div>
    </form>
  </section>
</div>

<div class="overlay" id="loginOverlay">
  <section class="modal small">
    <header class="modal-head">
      <h2>Login Admin</h2>
      <button class="icon-btn" id="closeLogin">✕</button>
    </header>
    <form id="loginForm" class="modal-body">
      <label class="field">Email
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label class="field">Password
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <button class="btn primary full">Masuk</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>
</div>

<footer>© 2026 The Velmoric Codex</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/music-player.js"></script>
<script src="js/logic.js"></script>
</body>
</html>
