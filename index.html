<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101016">
    <meta name="description" content="The Velmoric Codex - Fantasy World Encyclopedia">

    <title>The Velmoric Codex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

    <button class="btn mobile-menu" id="menuBtn">☰</button>

    <button class="brand" id="brandBtn">

        <span class="brand-symbol">V</span>

        <span>
            <span class="brand-name">VELMORIC CODEX</span>
            <small>ENCYCLOPEDIA</small>
        </span>

    </button>

    <div class="search-wrap">
        <input
            id="search"
            type="search"
            placeholder="Cari karakter, kerajaan, artefak..."
        >
    </div>

    <div class="top-actions">

        <button class="btn" id="btnLogin">
            Login Admin
        </button>

        <button class="btn" id="btnLogout" hidden>
            Logout
        </button>

        <button class="btn primary" id="btnAdd" hidden>
            + Tambah
        </button>

    </div>

</header>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <p class="side-heading">NAVIGASI</p>

        <button class="side-link active" id="navHome">
            ◈ Beranda
        </button>

        <button class="side-link" id="navAdmin" hidden>
            ⚙ Panel Admin
        </button>

        <p class="side-heading">ARSIP DUNIA</p>

        <div id="charList"></div>

        <p class="side-heading">INFORMASI</p>

        <p style="padding:10px;color:var(--muted);font-size:11px;line-height:1.8">
            The Velmoric Codex
            <br>
            A record of another world.
        </p>

    </aside>

    <main id="main">
        <p>Memuat Codex...</p>
    </main>

</div>

<!-- FORM KARAKTER -->

<div class="modal-overlay" id="overlay">

    <div class="modal">

        <button class="modal-close" id="closeModal">×</button>

        <h2 id="modalTitle">Tambah Entri</h2>

        <form id="charForm">

            <div class="form-grid">

                <div class="field full">
                    <label>Nama</label>
                    <input name="nama" required>
                </div>

                <div class="field">
                    <label>Kategori</label>
                    <select name="kategori">
                        <option>Karakter</option>
                        <option>Kerajaan</option>
                        <option>Ras</option>
                        <option>Makhluk</option>
                        <option>Artefak</option>
                        <option>Lokasi</option>
                        <option>Organisasi</option>
                        <option>Peristiwa</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div class="field">
                    <label>Gelar</label>
                    <input name="gelar">
                </div>

                <div class="field">
                    <label>Ras</label>
                    <input name="ras">
                </div>

                <div class="field">
                    <label>Gender</label>
                    <input name="gender">
                </div>

                <div class="field">
                    <label>Usia</label>
                    <input name="usia">
                </div>

                <div class="field">
                    <label>Tinggi</label>
                    <input name="tinggi">
                </div>

                <div class="field">
                    <label>Berat</label>
                    <input name="berat">
                </div>

                <div class="field">
                    <label>Asal</label>
                    <input name="asal">
                </div>

                <div class="field">
                    <label>Afiliasi</label>
                    <input name="afiliasi">
                </div>

                <div class="field">
                    <label>Status</label>
                    <input name="status">
                </div>

                <div class="field">
                    <label>Kelas</label>
                    <input name="kelas">
                </div>

                <div class="field full">
                    <label>URL Gambar</label>
                    <input
                        name="foto"
                        id="fotoUrlInput"
                        type="url"
                        placeholder="https://..."
                    >
                    <img id="fotoPreview" hidden alt="Preview">
                </div>

                <div class="field full">
                    <label>Deskripsi</label>
                    <textarea name="deskripsi"></textarea>
                </div>

                <div class="field full">
                    <label>Kepribadian</label>
                    <textarea name="kepribadian"></textarea>
                </div>

                <div class="field full">
                    <label>Latar Belakang</label>
                    <textarea name="latar"></textarea>
                </div>

                <div class="field full">
                    <label>Kemampuan</label>
                    <textarea name="kemampuan"></textarea>
                </div>

                <div class="field full">
                    <label>Kelemahan</label>
                    <textarea name="kelemahan"></textarea>
                </div>

            </div>

            <div class="modal-actions">

                <button type="button" class="btn" id="cancelBtn">
                    Batal
                </button>

                <button type="submit" class="btn primary" id="submitBtn">
                    Simpan Entri
                </button>

            </div>

        </form>

    </div>

</div>

<!-- LOGIN ADMIN -->

<div class="modal-overlay" id="loginOverlay">

    <div class="modal" style="max-width:420px">

        <button class="modal-close" id="closeLogin">×</button>

        <h2>Administrator Access</h2>

        <p style="color:var(--muted);font-size:13px;margin-bottom:20px">
            Khusus administrator. Pembaca tidak perlu login;
            kamu otomatis masuk sebagai pembaca anonim.
        </p>

        <form id="loginForm">

            <div class="field">
                <label>Email Administrator</label>
                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="loginError" class="error"></p>

            <button
                class="btn primary"
                type="submit"
                style="width:100%"
            >
                Masuk
            </button>

        </form>

    </div>

</div>

<!-- PENGATURAN ADMIN -->

<div class="modal-overlay" id="adminSettingsModal">

    <div class="modal">

        <button class="modal-close" id="closeSettings">×</button>

        <h2>Website Configuration</h2>

        <div class="field">
            <label>Tema Website</label>

            <label style="display:flex;gap:10px;align-items:center">
                <input type="checkbox" id="toggleTheme" style="width:auto">
                Gunakan tema terang
            </label>
        </div>

        <div class="field">
            <label>Playlist Musik</label>

            <textarea
                id="inputMusicUrl"
                placeholder="Masukkan URL audio, satu URL per baris"
            ></textarea>
        </div>

        <div class="modal-actions">

            <button class="btn" id="btnSaveSettings">
                Simpan Pengaturan
            </button>

        </div>

    </div>

</div>

<!-- STATUS / TOAST -->

<div id="appStatus" class="toast status" role="status" aria-live="polite" hidden></div>

<!-- PEMUTAR MUSIK -->

<audio id="bgMusic" preload="metadata"></audio>

<div class="bottom-player" id="musicPlayer" aria-label="Pemutar musik">

    <span class="track-title" id="trackTitle">Belum ada musik</span>

    <div class="player-controls">

        <button type="button" class="player-btn" id="btnPrevTrack" aria-label="Lagu sebelumnya">⏮</button>

        <button type="button" class="player-btn" id="btnPlayPause" aria-label="Putar atau jeda">
            <span id="iconPlay">▶</span>
            <span id="iconPause" hidden>⏸</span>
        </button>

        <button type="button" class="player-btn" id="btnNextTrack" aria-label="Lagu berikutnya">⏭</button>

    </div>

    <div class="player-progress">
        <span id="timeCurrent">0:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="timeTotal">0:00</span>
    </div>

</div>

<!-- BACKUP -->

<input
    type="file"
    id="btnImport"
    accept=".json,application/json"
>

<!-- FIREBASE INITIALIZATION -->

<script>
    window.firebaseReady = false;
</script>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/music-player.js"></script>
<script src="js/logic.js"></script>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signInAnonymously,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        setDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    /*
       Config Firebase proyekmu. (Kunci web Firebase memang publik;
       keamanan data dijaga oleh firestore.rules.)

       Firebase Console:
       Project Settings
       General
       Your apps
       SDK setup and configuration
       Config
    */

    const firebaseConfig = {
        apiKey: "AIzaSyBb4xpWkV2sSARxKGS5UuRJwu8bG-qlkig",
  authDomain: "login-5ab48.firebaseapp.com",
  projectId: "login-5ab48",
  storageBucket: "login-5ab48.firebasestorage.app",
  messagingSenderId: "770076903708",
  appId: "1:770076903708:web:d493b3660094c084f892d9"
    };

    try {

        const app = initializeApp(firebaseConfig);

        window.firebaseAuth = getAuth(app);

        window.firebaseDB = getFirestore(app);

        window.firebaseFuncs = {

            signOut,

            collection,
            doc,
            getDoc,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            setDoc
        };

        window.firebaseReady = true;

        window.dispatchEvent(
            new Event("firebase-ready")
        );

    } catch (error) {

        console.error("Firebase initialization error:", error);

        window.dispatchEvent(
            new Event("firebase-error")
        );

    }

</script>

</body>
</html>
