
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101016">
    <meta name="description" content="The Velmoric Codex - Fantasy World Encyclopedia">

    <title>The Velmoric Codex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #101016;
            --panel: #191922;
            --panel2: #20202b;
            --text: #e8e3d8;
            --muted: #9693a1;
            --gold: #c8a76a;
            --border: rgba(200,167,106,.2);
            --danger: #bd5c66;
            --sidebar: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
            min-height: 100vh;
        }

        body.light-mode {
            --bg: #eeeae2;
            --panel: #fffdf8;
            --panel2: #e7e1d6;
            --text: #29251f;
            --muted: #777064;
            --gold: #94713b;
            --border: rgba(100,75,35,.2);
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: var(--gold);
            text-decoration: none;
        }

        .topbar {
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 25px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 230px;
            border: 0;
            color: var(--text);
            background: transparent;
            text-align: left;
        }

        .brand-symbol {
            color: var(--gold);
            font-family: Cinzel, serif;
            font-size: 32px;
        }

        .brand-name {
            font-family: Cinzel, serif;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 3px;
        }

        .search-wrap {
            flex: 1;
            max-width: 600px;
        }

        .search-wrap input {
            width: 100%;
            padding: 11px 15px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: var(--sidebar);
            flex-shrink: 0;
            padding: 25px 16px;
            background: var(--panel);
            border-right: 1px solid var(--border);
        }

        .side-heading {
            margin: 20px 10px 12px;
            color: var(--gold);
            font-family: Cinzel, serif;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .side-link {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px;
            margin-bottom: 5px;
            color: var(--muted);
            background: transparent;
            border: 0;
            border-radius: 6px;
            text-align: left;
        }

        .side-link:hover,
        .side-link.active {
            color: var(--gold);
            background: var(--panel2);
        }

        .side-avatar img {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 5px;
        }

        main {
            flex: 1;
            min-width: 0;
            max-width: 1500px;
            padding: 35px;
            margin: 0 auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 55px;
            min-height: 290px;
            background:
                linear-gradient(90deg, rgba(12,12,19,.98), rgba(12,12,19,.75), rgba(12,12,19,.3)),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=85") center/cover;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 650px;
        }

        .hero h1 {
            margin: 15px 0;
            color: #e4c58d;
            font-family: Cinzel, serif;
            font-size: clamp(30px, 5vw, 55px);
        }

        .hero p {
            color: #d2c9bb;
            line-height: 1.8;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 3px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 16px;
            color: var(--text);
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn.primary {
            color: #18140d;
            background: var(--gold);
            border-color: var(--gold);
        }

        .btn.danger {
            color: #fff;
            background: var(--danger);
            border-color: var(--danger);
        }

        .small-btn {
            padding: 7px 10px;
            margin: 10px 4px 0 0;
            font-size: 12px;
        }

        .codex-intro {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 30px 5px;
            border-bottom: 1px solid var(--border);
        }

        .codex-intro h2,
        .archive-heading {
            font-family: Cinzel, serif;
        }

        .codex-intro p {
            margin-top: 8px;
            color: var(--muted);
            line-height: 1.7;
        }

        .intro-stat {
            text-align: center;
        }

        .intro-stat strong {
            display: block;
            color: var(--gold);
            font-family: Cinzel, serif;
            font-size: 35px;
        }

        .intro-stat span {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }

        .archive-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 30px 0 20px;
        }

        .archive-heading small {
            color: var(--muted);
            font-family: Inter, sans-serif;
            font-size: 12px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 9px;
            cursor: pointer;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .avatar {
            height: 230px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            background: var(--panel2);
            font-size: 50px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 17px;
        }

        .card h3 {
            margin-bottom: 8px;
            font-family: Cinzel, serif;
        }

        .card small,
        .muted {
            color: var(--muted);
        }

        .card p {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .page-title {
            margin: 25px 0 8px;
            font-family: Cinzel, serif;
            font-size: clamp(27px, 5vw, 42px);
        }

        .article-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 30px;
            margin-top: 30px;
        }

        .toc,
        .section,
        .infobox {
            padding: 22px;
            margin-bottom: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .toc ol {
            padding-left: 22px;
            margin-top: 15px;
            line-height: 2;
        }

        .section h2 {
            margin-bottom: 15px;
            color: var(--gold);
            font-family: Cinzel, serif;
        }

        .section p {
            color: var(--muted);
            line-height: 1.9;
        }

        .infobox h2 {
            margin-bottom: 15px;
            font-family: Cinzel, serif;
        }

        .infobox-img {
            height: 250px;
            overflow: hidden;
            margin-bottom: 15px;
            background: var(--panel2);
        }

        .infobox-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .infobox table {
            width: 100%;
            border-collapse: collapse;
        }

        .infobox th,
        .infobox td {
            padding: 10px 5px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 12px;
        }

        .infobox th {
            color: var(--gold);
        }

        .empty {
            padding: 25px;
            color: var(--muted);
        }

        .status {
            padding: 10px;
            color: var(--gold);
        }

        .error {
            padding: 10px;
            color: #ff8d8d;
        }

        /* MODALS */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(0,0,0,.78);
            backdrop-filter: blur(7px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: var(--gold);
            font-family: Cinzel, serif;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 11px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            outline: none;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--gold);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-close {
            float: right;
            color: var(--muted);
            background: none;
            border: 0;
            font-size: 25px;
        }

        #fotoPreview {
            max-width: 120px;
            max-height: 120px;
            object-fit: cover;
            margin-top: 10px;
            border-radius: 6px;
        }

        .no-scroll {
            overflow: hidden;
        }

        #navAdmin,
        #btnLogout,
        #btnAdd {
            display: none;
        }

        #navAdmin:not([hidden]),
        #btnLogout:not([hidden]),
        #btnAdd:not([hidden]) {
            display: inline-flex;
        }

        #btnImport {
            display: none;
        }

        .mobile-menu {
            display: none;
        }

        @media(max-width: 850px) {
            .sidebar {
                position: fixed;
                z-index: 30;
                top: 70px;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                transition: .2s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: inline-flex;
            }

            .brand {
                min-width: auto;
            }

            .brand small {
                display: none;
            }

            main {
                padding: 20px;
            }

            .article-grid {
                grid-template-columns: 1fr;
            }

            .infobox {
                grid-row: 1;
            }
        }

        @media(max-width: 550px) {
            .topbar {
                gap: 10px;
                padding: 0 12px;
            }

            .brand-name {
                font-size: 11px;
            }

            .brand-symbol {
                font-size: 24px;
            }

            .search-wrap input {
                padding: 9px;
                font-size: 12px;
            }

            .top-actions {
                gap: 5px;
            }

            .top-actions .btn {
                padding: 8px;
                font-size: 11px;
            }

            .hero {
                padding: 30px 20px;
            }

            .codex-intro {
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <button class="btn mobile-menu" id="menuBtn">☰</button>

    <button class="brand" id="brandBtn">

        <span class="brand-symbol">V</span>

        <span>
            <span class="brand-name">VELMORIC CODEX</span>
            <small>ENCYCLOPEDIA</small>
        </span>

    </button>

    <div class="search-wrap">
        <input
            id="search"
            type="search"
            placeholder="Cari karakter, kerajaan, artefak..."
        >
    </div>

    <div class="top-actions">

        <button class="btn" id="btnLogin">
            Login Admin
        </button>

        <button class="btn" id="btnLogout" hidden>
            Logout
        </button>

        <button class="btn primary" id="btnAdd" hidden>
            + Tambah
        </button>

    </div>

</header>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <p class="side-heading">NAVIGASI</p>

        <button class="side-link active" id="navHome">
            ◈ Beranda
        </button>

        <button class="side-link" id="navAdmin" hidden>
            ⚙ Panel Admin
        </button>

        <p class="side-heading">ARSIP DUNIA</p>

        <div id="charList"></div>

        <p class="side-heading">INFORMASI</p>

        <p style="padding:10px;color:var(--muted);font-size:11px;line-height:1.8">
            The Velmoric Codex
            <br>
            A record of another world.
        </p>

    </aside>

    <main id="main">
        <p>Memuat Codex...</p>
    </main>

</div>

<!-- FORM KARAKTER -->

<div class="modal-overlay" id="overlay">

    <div class="modal">

        <button class="modal-close" id="closeModal">×</button>

        <h2 id="modalTitle">Tambah Entri</h2>

        <form id="charForm">

            <div class="form-grid">

                <div class="field full">
                    <label>Nama</label>
                    <input name="nama" required>
                </div>

                <div class="field">
                    <label>Kategori</label>
                    <select name="kategori">
                        <option>Karakter</option>
                        <option>Kerajaan</option>
                        <option>Ras</option>
                        <option>Makhluk</option>
                        <option>Artefak</option>
                        <option>Lokasi</option>
                        <option>Organisasi</option>
                        <option>Peristiwa</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div class="field">
                    <label>Gelar</label>
                    <input name="gelar">
                </div>

                <div class="field">
                    <label>Ras</label>
                    <input name="ras">
                </div>

                <div class="field">
                    <label>Gender</label>
                    <input name="gender">
                </div>

                <div class="field">
                    <label>Usia</label>
                    <input name="usia">
                </div>

                <div class="field">
                    <label>Tinggi</label>
                    <input name="tinggi">
                </div>

                <div class="field">
                    <label>Berat</label>
                    <input name="berat">
                </div>

                <div class="field">
                    <label>Asal</label>
                    <input name="asal">
                </div>

                <div class="field">
                    <label>Afiliasi</label>
                    <input name="afiliasi">
                </div>

                <div class="field">
                    <label>Status</label>
                    <input name="status">
                </div>

                <div class="field">
                    <label>Kelas</label>
                    <input name="kelas">
                </div>

                <div class="field full">
                    <label>URL Gambar</label>
                    <input
                        name="foto"
                        id="fotoUrlInput"
                        type="url"
                        placeholder="https://..."
                    >
                    <img id="fotoPreview" hidden alt="Preview">
                </div>

                <div class="field full">
                    <label>Deskripsi</label>
                    <textarea name="deskripsi"></textarea>
                </div>

                <div class="field full">
                    <label>Kepribadian</label>
                    <textarea name="kepribadian"></textarea>
                </div>

                <div class="field full">
                    <label>Latar Belakang</label>
                    <textarea name="latar"></textarea>
                </div>

                <div class="field full">
                    <label>Kemampuan</label>
                    <textarea name="kemampuan"></textarea>
                </div>

                <div class="field full">
                    <label>Kelemahan</label>
                    <textarea name="kelemahan"></textarea>
                </div>

            </div>

            <div class="modal-actions">

                <button type="button" class="btn" id="cancelBtn">
                    Batal
                </button>

                <button type="submit" class="btn primary" id="submitBtn">
                    Simpan Entri
                </button>

            </div>

        </form>

    </div>

</div>

<!-- LOGIN ADMIN -->

<div class="modal-overlay" id="loginOverlay">

    <div class="modal" style="max-width:420px">

        <button class="modal-close" id="closeLogin">×</button>

        <h2>Administrator Access</h2>

        <p style="color:var(--muted);font-size:13px;margin-bottom:20px">
            Masuk menggunakan akun administrator.
        </p>

        <form id="loginForm">

            <div class="field">
                <label>Email Administrator</label>
                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="loginError" class="error"></p>

            <button
                class="btn primary"
                type="submit"
                style="width:100%"
            >
                Masuk
            </button>

        </form>

    </div>

</div>

<!-- PENGATURAN ADMIN -->

<div class="modal-overlay" id="adminSettingsModal">

    <div class="modal">

        <button class="modal-close" id="closeSettings">×</button>

        <h2>Website Configuration</h2>

        <div class="field">
            <label>Tema Website</label>

            <label style="display:flex;gap:10px;align-items:center">
                <input type="checkbox" id="toggleTheme" style="width:auto">
                Gunakan tema terang
            </label>
        </div>

        <div class="field">
            <label>Playlist Musik</label>

            <textarea
                id="inputMusicUrl"
                placeholder="Masukkan URL audio, satu URL per baris"
            ></textarea>
        </div>

        <div class="modal-actions">

            <button class="btn" id="btnSaveSettings">
                Simpan Pengaturan
            </button>

        </div>

    </div>

</div>

<!-- BACKUP -->

<input
    type="file"
    id="btnImport"
    accept=".json,application/json"
>

<!-- FIREBASE INITIALIZATION -->

<script>
    window.firebaseReady = false;
</script>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/music-player.js"></script>
<script src="js/logic.js"></script>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signInAnonymously,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        setDoc
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    /*
       GANTI CONFIG INI DENGAN FIREBASE CONFIG MILIK LU.

       Firebase Console:
       Project Settings
       General
       Your apps
       SDK setup and configuration
       Config
    */

    const firebaseConfig = {
        apiKey: "ISI_API_KEY",
        authDomain: "ISI_AUTH_DOMAIN",
        projectId: "ISI_PROJECT_ID",
        storageBucket: "ISI_STORAGE_BUCKET",
        messagingSenderId: "ISI_MESSAGING_SENDER_ID",
        appId: "ISI_APP_ID"
    };

    try {

        const app = initializeApp(firebaseConfig);

        window.firebaseAuth = getAuth(app);

        window.firebaseDB = getFirestore(app);

        window.firebaseFuncs = {
            onAuthStateChanged,
            signInAnonymously,
            signInWithEmailAndPassword,
            signOut,

            collection,
            doc,
            getDoc,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            setDoc
        };

        window.firebaseReady = true;

        window.dispatchEvent(
            new Event("firebase-ready")
        );

    } catch (error) {

        console.error("Firebase initialization error:", error);

        window.dispatchEvent(
            new Event("firebase-error")
        );

    }

</script>

</body>
</html>
