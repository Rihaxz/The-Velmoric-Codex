<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Velmoric Codex — Ensiklopedia Karakter</title>
  <meta name="description" content="Arsip hidup tentang benua, ras, karakter, dan segala yang ada di antaranya.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" title="Buka menu" aria-label="Buka menu">☰</button>
    <div class="brand" id="brandBtn">
      <span class="brand-globe">📖</span>
      <span class="brand-text"><strong>VELMORIC</strong> CODEX</span>
    </div>
    <div class="search-wrap">
      <input id="search" class="search" type="search"
             placeholder="Cari karakter, ras, afiliasi…" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="btnAdd">
      ＋ <span>Tambah Entri</span>
    </button>
  </header>

  <!-- ================= LAYOUT ================= -->
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-title">Navigasi</div>
      <div class="side-link" id="navHome">🏠 <span class="side-name">Halaman Utama</span></div>
      <div class="side-link" id="navAdd">➕ <span class="side-name">Tambah Entri</span></div>

      <div class="side-title">Daftar Entri</div>
      <div id="charList"></div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <!-- ================= MODAL FORM ================= -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Tambah Entri Baru</h2>
        <button class="icon-btn" id="closeModal" title="Tutup">✕</button>
      </div>

      <form id="charForm" autocomplete="off">
        <div class="form-grid">
          <label class="field"><span>Nama <em>*</em></span><input name="nama" placeholder="Contoh: Arka Wijaya" required></label>
          
          <!-- INPUT FOTO BARU -->
          <label class="field">
            <span>Foto Karakter (Opsional)</span>
            <input type="file" id="fotoFile" accept="image/*" style="padding: 4px;">
            <div id="previewWrap" style="display:none; margin-top:8px; text-align:center;">
              <img id="fotoPreview" style="max-height: 100px; border-radius: 4px; border: 1px solid #ccc;">
            </div>
          </label>

          <label class="field"><span>Avatar (Emoji jika tanpa foto)</span><input name="avatar" placeholder="👤"></label>
          <label class="field"><span>Gelar / Julukan</span><input name="gelar" placeholder="Sang Penjaga Naga"></label>
          <label class="field"><span>Ras / Spesies</span><input name="ras" placeholder="Manusia, Elf, Naga…"></label>
          <label class="field"><span>Jenis Kelamin</span><input name="gender"></label>
          <label class="field"><span>Usia</span><input name="usia" placeholder="27 tahun"></label>
          <label class="field"><span>Tinggi</span><input name="tinggi" placeholder="182 cm"></label>
          <label class="field"><span>Berat</span><input name="berat" placeholder="74 kg"></label>
          <label class="field"><span>Asal / Dunia</span><input name="asal" placeholder="Kerajaan Arunika"></label>
          <label class="field"><span>Afiliasi</span><input name="afiliasi" placeholder="Ordo Cakrawala"></label>
          <label class="field"><span>Status</span><input name="status" placeholder="Aktif / Gugur / Hilang"></label>
          <label class="field"><span>Elemen / Kelas</span><input name="kelas" placeholder="Api · Ksatria"></label>
        </div>

        <label class="field full"><span>Deskripsi Singkat</span><textarea name="deskripsi" rows="2" placeholder="Satu-dua kalimat yang merangkum karakter ini…"></textarea></label>
        <label class="field full"><span>Kepribadian</span><textarea name="kepribadian" rows="3"></textarea></label>
        <label class="field full"><span>Latar Belakang</span><textarea name="latar" rows="4"></textarea></label>
        <label class="field full"><span>Kemampuan / Kekuatan</span><textarea name="kemampuan" rows="3"></textarea></label>
        <label class="field full"><span>Kelemahan</span><textarea name="kelemahan" rows="3"></textarea></label>

        <div class="form-actions">
          <button type="button" class="btn" id="cancelBtn">Batal</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">💾 Simpan Entri</button>
        </div>
      </form>
    </div>
  </div>

  <footer style="text-align: center; padding: 20px; font-size: 12px; color: #54595d; border-top: 1px solid #eaecf0; margin-top: 40px;">
    &copy; 2026 <strong>The Velmoric Codex</strong>. All rights reserved.<br>
    <span style="font-size: 11px;">Dilarang menyalin, mendistribusikan, atau menggunakan sebagian/seluruh konten tanpa izin tertulis.</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
