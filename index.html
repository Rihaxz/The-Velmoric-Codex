<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101016">
    <meta name="description" content="The Velmoric Codex - Fantasy World Encyclopedia">

    <title>The Velmoric Codex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="modulepreload" href="js/firebase.js">
</head>

<body>

<script>
    /* Terapkan tema tersimpan sebelum halaman tampil (mencegah kedipan). */
    try {
        var saved = JSON.parse(localStorage.getItem("velmoric:settings:v1") || "{}");
        if (saved.theme === "light") document.body.classList.add("light-mode");
    } catch (e) {}
</script>

<header class="topbar">

    <button class="btn mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button>

    <button class="brand" id="brandBtn">

        <span class="brand-symbol">V</span>

        <span>
            <span class="brand-name">VELMORIC CODEX</span>
            <small>ENCYCLOPEDIA</small>
        </span>

    </button>

    <div class="search-wrap">
        <input
            id="search"
            type="search"
            placeholder="Cari karakter, kerajaan, artefak..."
        >
    </div>

    <div class="top-actions">

        <button class="btn" id="btnLogout" hidden>
            Logout
        </button>

        <button class="btn primary" id="btnAdd" hidden>
            + Tambah
        </button>

    </div>

</header>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <p class="side-heading">NAVIGASI</p>

        <button class="side-link active" id="navHome">
            ◈ Beranda
        </button>

        <button class="side-link" id="navAdmin" hidden>
            ⚙ Panel Admin
        </button>

        <p class="side-heading">ARSIP DUNIA</p>

        <div id="charList"></div>

        <p class="side-heading">INFORMASI</p>

        <p style="padding:10px;color:var(--muted);font-size:11px;line-height:1.8">
            The Velmoric Codex
            <br>
            A record of another world.
        </p>

    </aside>

    <main id="main">
        <p>Memuat Codex...</p>
    </main>

</div>

<!-- FORM KARAKTER -->

<div class="modal-overlay" id="overlay">

    <div class="modal">

        <button class="modal-close" id="closeModal" aria-label="Tutup">×</button>

        <h2 id="modalTitle">Tambah Entri</h2>

        <form id="charForm">

            <!-- Field dibuat otomatis dari js/schema.js -->
            <div class="form-grid" id="formFields"></div>

            <div class="modal-actions">

                <button type="button" class="btn" id="cancelBtn">
                    Batal
                </button>

                <button type="submit" class="btn primary" id="submitBtn">
                    Simpan Entri
                </button>

            </div>

        </form>

    </div>

</div>

<!-- LOGIN ADMIN -->

<div class="modal-overlay" id="loginOverlay">

    <div class="modal" style="max-width:420px">

        <button class="modal-close" id="closeLogin" aria-label="Tutup">×</button>

        <h2>Administrator Access</h2>

        <p style="color:var(--muted);font-size:13px;margin-bottom:20px">
            Khusus administrator. Pembaca tidak perlu login;
            kamu otomatis masuk sebagai pembaca anonim.
        </p>

        <form id="loginForm">

            <div class="field">
                <label>Email Administrator</label>
                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="loginError" class="error"></p>

            <button
                class="btn primary"
                type="submit"
                style="width:100%"
            >
                Masuk
            </button>

        </form>

    </div>

</div>

<!-- PENGATURAN ADMIN -->

<div class="modal-overlay" id="adminSettingsModal">

    <div class="modal">

        <button class="modal-close" id="closeSettings" aria-label="Tutup">×</button>

        <h2>Website Configuration</h2>

        <div class="field">
            <label>Tema Website</label>

            <label style="display:flex;gap:10px;align-items:center">
                <input type="checkbox" id="toggleTheme" style="width:auto">
                Gunakan tema terang
            </label>
        </div>

        <div class="field">
            <label>Playlist Musik</label>

            <textarea
                id="inputMusicUrl"
                placeholder="Masukkan URL audio, satu URL per baris"
            ></textarea>
        </div>

        <div class="modal-actions">

            <button class="btn" id="btnSaveSettings">
                Simpan Pengaturan
            </button>

        </div>

    </div>

</div>

<!-- STATUS / TOAST -->

<div id="appStatus" class="toast status" role="status" aria-live="polite" hidden></div>

<!-- PEMUTAR MUSIK -->

<audio id="bgMusic" preload="metadata"></audio>

<div class="bottom-player" id="musicPlayer" aria-label="Pemutar musik">

    <span class="track-title" id="trackTitle">Belum ada musik</span>

    <div class="player-controls">

        <button type="button" class="player-btn" id="btnPrevTrack" aria-label="Lagu sebelumnya">⏮</button>

        <button type="button" class="player-btn" id="btnPlayPause" aria-label="Putar atau jeda">
            <span id="iconPlay">▶</span>
            <span id="iconPause" hidden>⏸</span>
        </button>

        <button type="button" class="player-btn" id="btnNextTrack" aria-label="Lagu berikutnya">⏭</button>

    </div>

    <div class="player-progress">
        <span id="timeCurrent">0:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="timeTotal">0:00</span>
    </div>

</div>

<!-- BACKUP -->

<input
    type="file"
    id="btnImport"
    accept=".json,application/json"
>

<!-- APLIKASI (modul ES; config Firebase ada di js/firebase.js) -->

<script
    type="module"
    src="js/app.js"
    onerror="document.getElementById('main').innerHTML='<p class=&quot;empty&quot;>Gagal memuat aplikasi. Periksa koneksi internet lalu muat ulang halaman.</p>'"
></script>

</body>
</html>
